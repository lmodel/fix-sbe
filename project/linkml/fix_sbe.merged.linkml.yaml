  "description": "A LinkML model of FIX Simple Binary Encoding, a standard from the FIX Trading Community for encoding messages in binary. It describes SBE message schemas: encodings, message templates, fields, groups and variable-length data. The two editions differ on the wire and in their XML, so each has a module of its own.",
  "title": "FIX Simple Binary Encoding (SBE)",
  "comments": [
    "A document of SBE 1.0 starts at SbeMessageSchemaV1, the tree root, and one of SBE 2.0 RC3 at SbeMessageSchemaV2. upstream/ holds both XSDs unchanged, tests/test_coverage.py compares the modules with them, and scripts/check_upstream_release.py reports when either changes."
  ],
  "source": "https://github.com/FIXTradingCommunity/fix-simple-binary-encoding",
  "see_also": [
    "https://lmodel.github.io/fix-sbe",
    "https://github.com/FIXTradingCommunity/fix-simple-binary-encoding",
    "https://www.iana.org/assignments/media-types/application/sbe"
  ],
  "keywords": [
    "FIX",
    "SBE",
    "binary encoding",
    "message schema",
    "wire format"
  ],
