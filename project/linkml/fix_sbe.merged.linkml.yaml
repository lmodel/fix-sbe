        "semantic_type stays free text in the schema, because a message's holds a MsgType value and the specification suggests matching names ignoring case. tests/sbe_rules.py checks an encoding's and a field's against this list."
      ],
      "from_schema": "https://w3id.org/lmodel/fix-sbe",
