    "SbeSymbolicName": {
      "name": "SbeSymbolicName",
      "annotations": {
        "xsd_type": {
          "tag": "xsd_type",
          "value": "symbolicName_t"
        }
      },
      "description": "A name of one to 64 letters, digits and underscores that starts with a letter or underscore.",
      "from_schema": "https://w3id.org/lmodel/fix-sbe",
      "typeof": "string",
      "base": "str",
      "uri": "xsd:string",
      "pattern": "^[A-Za-z_][0-9A-Za-z_]{0,63}$"
    },
    "SbeQualifiedName": {
      "name": "SbeQualifiedName",
      "annotations": {
        "xsd_type": {
          "tag": "xsd_type",
          "value": "qualifiedName_t"
        }
      },
      "description": "An enumeration's name and one of its valid values' names, joined by a dot.",
      "from_schema": "https://w3id.org/lmodel/fix-sbe",
      "typeof": "string",
      "base": "str",
      "uri": "xsd:string",
      "pattern": "^[A-Za-z_][0-9A-Za-z_]*\\.[A-Za-z_][0-9A-Za-z_]*$"
    },
    "SbeToken": {
      "name": "SbeToken",
      "annotations": {
        "xsd_type": {
          "tag": "xsd_type",
          "value": "xs:token"
        }
      },
      "description": "Text with no line break, tab or doubled space, and no space at either end.",
      "from_schema": "https://w3id.org/lmodel/fix-sbe",
      "typeof": "string",
      "base": "str",
      "uri": "xsd:token",
      "pattern": "^\\S+( \\S+)*$"
    }
  },
  "enums": {
    "SbePresence": {
      "name": "SbePresence",
      "annotations": {
        "sbe_section": {
