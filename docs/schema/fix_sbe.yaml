    - SbeBlockV2Mixin_sbe_id
    - block_length
    - SbeBlockV2Mixin_alignment
    - semantic_type
    - description
    - SbeBlockV2Mixin_repeating_groups
    - SbeBlockV2Mixin_var_data_fields
    slot_usage:
      block_fields:
        name: block_fields
        required: true
        minimum_cardinality: 1
