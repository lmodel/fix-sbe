  SbeFieldV2:
    name: SbeFieldV2
    definition_uri: https://w3id.org/lmodel/fix-sbe/SbeFieldV2
    annotations:
      xsd_type:
        tag: xsd_type
        value: fieldType
      xml_element:
        tag: xml_element
        value: field
    description: A message's or group entry's field, which uses an encoding at a place
      in its block and may state a constant.
    comments:
    - The mapping to an Orchestra field is close, not exact. This field has a place
      in one block, and FIX's transposer carries one with a composite encoding to
      a component reference, not a field.
    from_schema: https://w3id.org/lmodel/fix-sbe/schema/fix_sbe_v2_0
    close_mappings:
    - fix_orchestra:OrchestraFieldV10
    mixins:
    - SbeVersionedMixin
    slots:
    - symbolic_name
    - SbeFieldV2_sbe_id
    - encoding_name
    - element_value
    - offset
    - SbeFieldV2_alignment
    - presence
    - null_value
    - min_value
    - max_value
    - value_ref
    - SbeFieldV2_semantic_type
    - description
    - since_version
    - deprecated_since
    slot_usage:
      sbe_id:
        name: sbe_id
        description: The field's FIX tag number.
        required: true
      semantic_type:
        name: semantic_type
        description: The FIX datatype this field carries.
      alignment:
        name: alignment
        description: The multiple of octets the start of this field is placed on,
          in place of an offset.
    class_uri: fix_sbe:SbeFieldV2
    rules:
    - preconditions:
        slot_conditions:
          value_ref:
            name: value_ref
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          presence:
            name: presence
            equals_string: constant
      annotations:
        sbe_section:
          tag: sbe_section
          value: '4: Field attributes'
      description: A value_ref is valid only on an element whose presence is constant.
      title: A reference to a value needs a constant
    - preconditions:
        slot_conditions:
          presence:
            name: presence
            equals_string: required
      postconditions:
        slot_conditions:
          null_value:
            name: null_value
            value_presence: ABSENT
      annotations:
        sbe_section:
          tag: sbe_section
          value: '4: Schema validation'
      description: A null value cannot sit beside a presence of required.
      title: A required value has no null
    - preconditions:
        slot_conditions:
          presence:
            name: presence
            equals_string: constant
      postconditions:
        slot_conditions:
          null_value:
            name: null_value
            value_presence: ABSENT
      annotations:
        sbe_section:
          tag: sbe_section
          value: '2: Common field schema attributes'
      description: A null value cannot sit beside a presence of constant.
      title: A constant has no null
    - preconditions:
        slot_conditions:
          presence:
            name: presence
            equals_string: constant
      postconditions:
        slot_conditions:
          min_value:
            name: min_value
            value_presence: ABSENT
      annotations:
        sbe_section:
          tag: sbe_section
          value: '2: Common field schema attributes'
      description: A lowest value cannot sit beside a presence of constant.
      title: A constant has no lowest value
    - preconditions:
        slot_conditions:
          presence:
            name: presence
            equals_string: constant
      postconditions:
        slot_conditions:
          max_value:
            name: max_value
            value_presence: ABSENT
      annotations:
        sbe_section:
          tag: sbe_section
          value: '2: Common field schema attributes'
      description: A highest value cannot sit beside a presence of constant.
      title: A constant has no highest value
    - preconditions:
        slot_conditions:
          alignment:
            name: alignment
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          offset:
            name: offset
            value_presence: ABSENT
      annotations:
        sbe_section:
          tag: sbe_section
          value: '3: Field byte alignment'
      description: A field places itself by an offset or by an alignment, never both.
      title: An offset or an alignment, not both
