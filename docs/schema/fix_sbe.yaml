    definition_uri: https://w3id.org/lmodel/fix-sbe/SbeCompositeV2
    annotations:
      xsd_type:
        tag: xsd_type
        value: compositeDataType
      xml_element:
        tag: xml_element
        value: composite
    description: An encoding built from members sent one after another, such as a
      decimal's mantissa and exponent.
    comments:
    - The members keep one list because their order is the order on the wire. Separate
      lists per kind of member could not say that an enum comes between two types.
    from_schema: https://w3id.org/lmodel/fix-sbe/schema/fix_sbe_v2_0
    close_mappings:
    - fix_orchestra:OrchestraComponentV10
    is_a: SbeMemberV2
    mixins:
    - SbeVersionedMixin
    slots:
    - encoding_kind
    - symbolic_name
    - description
    - offset
    - alignment
    - SbeCompositeV2_composite_members
    - since_version
    - deprecated_since
    slot_usage:
      composite_members:
        name: composite_members
        range: SbeMemberV2
    class_uri: fix_sbe:SbeCompositeV2
  SbeEnumV2:
    name: SbeEnumV2
    definition_uri: https://w3id.org/lmodel/fix-sbe/SbeEnumV2
    annotations:
      xsd_type:
        tag: xsd_type
        value: enumType
      xml_element:
        tag: xml_element
        value: enum
    description: An encoding whose value is one of a listed set of valid values.
    from_schema: https://w3id.org/lmodel/fix-sbe/schema/fix_sbe_v2_0
    close_mappings:
    - fix_orchestra:OrchestraCodeSetV10
    is_a: SbeMemberV2
    mixins:
    - SbeVersionedMixin
    slots:
    - encoding_kind
    - symbolic_name
    - description
    - offset
    - alignment
    - encoding_type
    - valid_values
    - since_version
    - deprecated_since
    class_uri: fix_sbe:SbeEnumV2
  SbeSetV2:
    name: SbeSetV2
    definition_uri: https://w3id.org/lmodel/fix-sbe/SbeSetV2
    annotations:
      xsd_type:
        tag: xsd_type
        value: setType
      xml_element:
        tag: xml_element
        value: set
    description: An encoding whose value is any combination of up to 64 choices, sent
      as a bitset.
    comments:
    - FIX's transposer does not carry a set to Orchestra, so the mapping is related.
      FIX's MultipleCharValue and MultipleStringValue fields hold such choices in
      a code set.
    from_schema: https://w3id.org/lmodel/fix-sbe/schema/fix_sbe_v2_0
    related_mappings:
    - fix_orchestra:OrchestraCodeSetV10
    is_a: SbeMemberV2
    mixins:
    - SbeVersionedMixin
    slots:
    - encoding_kind
    - symbolic_name
    - description
    - offset
    - alignment
    - encoding_type
    - choices
    - since_version
    - deprecated_since
    class_uri: fix_sbe:SbeSetV2
  SbeBlockV2Mixin:
    name: SbeBlockV2Mixin
    definition_uri: https://w3id.org/lmodel/fix-sbe/SbeBlockV2Mixin
    description: The body shared by a message and a group entry, which holds its fixed-length
      fields first, then groups, then variable-length data.
    from_schema: https://w3id.org/lmodel/fix-sbe/schema/fix_sbe_v2_0
    mixin: true
    slots:
    - symbolic_name
    - SbeBlockV2Mixin_sbe_id
    - block_length
    - SbeBlockV2Mixin_alignment
    - semantic_type
    - description
    - SbeBlockV2Mixin_block_fields
    - SbeBlockV2Mixin_repeating_groups
    - SbeBlockV2Mixin_var_data_fields
    slot_usage:
      sbe_id:
        name: sbe_id
        required: true
      alignment:
        name: alignment
        description: The multiple of octets where a message or each group entry begins.
      block_fields:
        name: block_fields
        range: SbeFieldV2
      repeating_groups:
        name: repeating_groups
        range: SbeGroupV2
      var_data_fields:
        name: var_data_fields
        range: SbeFieldV2
    class_uri: fix_sbe:SbeBlockV2Mixin
  SbeMessageV2:
    name: SbeMessageV2
    definition_uri: https://w3id.org/lmodel/fix-sbe/SbeMessageV2
    annotations:
      xsd_type:
        tag: xsd_type
        value: blockType
      xml_element:
        tag: xml_element
        value: message
    description: A message template, whose number and block length are sent in each
