classes:
  SbeVersionedMixin:
    name: SbeVersionedMixin
    definition_uri: https://w3id.org/lmodel/fix-sbe/SbeVersionedMixin
    annotations:
      xsd_attribute_group:
        tag: xsd_attribute_group
        value: versionAttributes
    description: The two attributes that record when an element entered a schema and
      when it should leave.
    from_schema: https://w3id.org/lmodel/fix-sbe/schema/fix_sbe_common
    mixin: true
    slots:
    - since_version
    - deprecated_since
    class_uri: fix_sbe:SbeVersionedMixin
  SbeValidValue:
    name: SbeValidValue
    definition_uri: https://w3id.org/lmodel/fix-sbe/SbeValidValue
    annotations:
      xsd_type:
        tag: xsd_type
        value: validValue
    description: One of the values an enumeration allows.
    from_schema: https://w3id.org/lmodel/fix-sbe/schema/fix_sbe_common
    close_mappings:
    - fix_orchestra:OrchestraCodeV10
    mixins:
    - SbeVersionedMixin
    slots:
    - symbolic_name
    - description
    - sbeValidValue__valid_value
    - since_version
    - deprecated_since
    attributes:
      valid_value:
        name: valid_value
        annotations:
          xsd_type:
            tag: xsd_type
            value: xs:token
          sbe_section:
            tag: sbe_section
            value: '4: Schema validation'
        description: The value as it is written in the schema, which must convert
          to the enumeration's encoding.
        range: SbeToken
        required: true
        pattern: ^\S+( \S+)*$
    class_uri: fix_sbe:SbeValidValue
  SbeChoice:
    name: SbeChoice
    definition_uri: https://w3id.org/lmodel/fix-sbe/SbeChoice
    annotations:
      xsd_type:
        tag: xsd_type
        value: choice
    description: One of the alternatives of a set, which is one bit of its encoding.
    comments:
    - FIX's transposer does not carry a set to Orchestra, so the mapping is related.
      FIX's MultipleCharValue and MultipleStringValue fields hold such choices in
      a code set.
    from_schema: https://w3id.org/lmodel/fix-sbe/schema/fix_sbe_common
    related_mappings:
    - fix_orchestra:OrchestraCodeV10
    mixins:
    - SbeVersionedMixin
    slots:
    - symbolic_name
    - description
    - sbeChoice__bit_position
    - since_version
