name: fix_sbe
annotations:
  upstream_v1_tag:
    tag: upstream_v1_tag
    value: v1.0-errata-Nov-2020
  upstream_v1_commit:
    tag: upstream_v1_commit
    value: 6321e6b9bce5bc198f88f462054cbaf4f33d8f60
  upstream_v2_commit:
    tag: upstream_v2_commit
    value: 418a8f6a8b93c65b308638dab2bc6a35dddcd864
description: 'A LinkML model of FIX Simple Binary Encoding, a standard from the FIX
  Trading Community for encoding messages in binary. It describes SBE message schemas:
  encodings, message templates, fields, groups and variable-length data. The two editions
  differ on the wire and in their XML, so each has a module of its own.'
title: FIX Simple Binary Encoding (SBE)
comments:
- A document of SBE 1.0 starts at SbeMessageSchemaV1, the tree root, and one of SBE
  2.0 RC3 at SbeMessageSchemaV2. upstream/ holds both XSDs unchanged, tests/test_coverage.py
  compares the modules with them, and scripts/check_upstream_release.py reports when
  either changes.
source: https://github.com/FIXTradingCommunity/fix-simple-binary-encoding
see_also:
- https://lmodel.github.io/fix-sbe
- https://github.com/FIXTradingCommunity/fix-simple-binary-encoding
- https://www.iana.org/assignments/media-types/application/sbe
keywords:
- FIX
- SBE
- binary encoding
- message schema
- wire format
id: https://w3id.org/lmodel/fix-sbe
version: 1.0 and 2.0-rc3
imports:
- linkml:types
- ./fix_sbe_common
- ./fix_sbe_v1_0
- ./fix_sbe_v2_0
license: Apache-2.0
prefixes:
  fix_sbe:
    prefix_prefix: fix_sbe
    prefix_reference: https://w3id.org/lmodel/fix-sbe/
  linkml:
    prefix_prefix: linkml
    prefix_reference: https://w3id.org/linkml/
  schema:
    prefix_prefix: schema
    prefix_reference: http://schema.org/
  fix_orchestra:
    prefix_prefix: fix_orchestra
    prefix_reference: https://w3id.org/lmodel/fix-orchestra/
default_prefix: fix_sbe
default_range: string
types:
  string:
    name: string
    definition_uri: https://w3id.org/linkml/String
    description: A character string
    notes:
    - In RDF serializations, a slot with range of string is treated as a literal or
      type xsd:string. If you are authoring schemas in LinkML YAML, the type is referenced
      with the lower case "string".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Text
    base: str
    uri: xsd:string
  integer:
    name: integer
    definition_uri: https://w3id.org/linkml/Integer
    description: An integer
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "integer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Integer
    base: int
    uri: xsd:integer
  boolean:
    name: boolean
    definition_uri: https://w3id.org/linkml/Boolean
    description: A binary (true or false) value
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "boolean".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Boolean
    base: Bool
    uri: xsd:boolean
    repr: bool
  float:
    name: float
    definition_uri: https://w3id.org/linkml/Float
    description: A real number that conforms to the xsd:float specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "float".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Float
    base: float
    uri: xsd:float
  double:
    name: double
    definition_uri: https://w3id.org/linkml/Double
    description: A real number that conforms to the xsd:double specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "double".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:Float
    base: float
    uri: xsd:double
  decimal:
    name: decimal
    definition_uri: https://w3id.org/linkml/Decimal
    description: A real number with arbitrary precision that conforms to the xsd:decimal
      specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "decimal".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    broad_mappings:
    - schema:Number
    base: Decimal
    uri: xsd:decimal
  time:
    name: time
    definition_uri: https://w3id.org/linkml/Time
    description: A time object represents a (local) time of day, independent of any
      particular day
    notes:
    - URI is dateTime because OWL reasoners do not work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "time".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Time
    base: XSDTime
    uri: xsd:time
    repr: str
  date:
    name: date
    definition_uri: https://w3id.org/linkml/Date
    description: a date (year, month and day) in an idealized calendar
    notes:
    - URI is dateTime because OWL reasoners don't work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Date
    base: XSDDate
    uri: xsd:date
    repr: str
  datetime:
    name: datetime
    definition_uri: https://w3id.org/linkml/Datetime
    description: The combination of a date and time
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:DateTime
    base: XSDDateTime
    uri: xsd:dateTime
    repr: str
  date_or_datetime:
    name: date_or_datetime
    definition_uri: https://w3id.org/linkml/DateOrDatetime
    description: Either a date or a datetime
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date_or_datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: linkml:DateOrDatetime
    repr: str
  uriorcurie:
    name: uriorcurie
    definition_uri: https://w3id.org/linkml/Uriorcurie
    description: a URI or a CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uriorcurie".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: URIorCURIE
    uri: xsd:anyURI
    repr: str
  curie:
    name: curie
    definition_uri: https://w3id.org/linkml/Curie
    conforms_to: https://www.w3.org/TR/curie/
    description: a compact URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "curie".
    comments:
    - in RDF serializations this MUST be expanded to a URI
    - in non-RDF serializations MAY be serialized as the compact representation
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: Curie
    uri: xsd:string
    repr: str
  uri:
    name: uri
    definition_uri: https://w3id.org/linkml/Uri
    conforms_to: https://www.ietf.org/rfc/rfc3987.txt
    description: a complete URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uri".
    comments:
    - in RDF serializations a slot with range of uri is treated as a literal or type
      xsd:anyURI unless it is an identifier or a reference to an identifier, in which
      case it is translated directly to a node
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:URL
    base: URI
    uri: xsd:anyURI
    repr: str
  ncname:
    name: ncname
    definition_uri: https://w3id.org/linkml/Ncname
    description: Prefix part of CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "ncname".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NCName
    uri: xsd:string
    repr: str
  objectidentifier:
    name: objectidentifier
    definition_uri: https://w3id.org/linkml/Objectidentifier
    description: A URI or CURIE that represents an object in the model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "objectidentifier".
    comments:
    - Used for inheritance and type checking
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: ElementIdentifier
    uri: shex:iri
    repr: str
  nodeidentifier:
    name: nodeidentifier
    definition_uri: https://w3id.org/linkml/Nodeidentifier
    description: A URI, CURIE or BNODE that represents a node in a model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "nodeidentifier".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NodeIdentifier
    uri: shex:nonLiteral
    repr: str
  jsonpointer:
    name: jsonpointer
    definition_uri: https://w3id.org/linkml/Jsonpointer
    conforms_to: https://datatracker.ietf.org/doc/html/rfc6901
    description: A string encoding a JSON Pointer. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to a valid object within the current
      instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpointer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  jsonpath:
    name: jsonpath
    definition_uri: https://w3id.org/linkml/Jsonpath
    conforms_to: https://www.ietf.org/archive/id/draft-goessner-dispatch-jsonpath-00.html
    description: A string encoding a JSON Path. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to zero or more valid objects within
      the current instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  sparqlpath:
    name: sparqlpath
    definition_uri: https://w3id.org/linkml/Sparqlpath
    conforms_to: https://www.w3.org/TR/sparql11-query/#propertypaths
    description: A string encoding a SPARQL Property Path. The value of the string
      MUST conform to SPARQL syntax and SHOULD dereference to zero or more valid objects
      within the current instance document when encoded as RDF.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "sparqlpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  SbeSymbolicName:
    name: SbeSymbolicName
    definition_uri: https://w3id.org/lmodel/fix-sbe/SbeSymbolicName
    annotations:
      xsd_type:
        tag: xsd_type
        value: symbolicName_t
    description: A name of one to 64 letters, digits and underscores that starts with
      a letter or underscore.
    from_schema: https://w3id.org/lmodel/fix-sbe/schema/fix_sbe_common
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^[A-Za-z_][0-9A-Za-z_]{0,63}$
  SbeQualifiedName:
    name: SbeQualifiedName
    definition_uri: https://w3id.org/lmodel/fix-sbe/SbeQualifiedName
    annotations:
      xsd_type:
        tag: xsd_type
        value: qualifiedName_t
    description: An enumeration's name and one of its valid values' names, joined
      by a dot.
    from_schema: https://w3id.org/lmodel/fix-sbe/schema/fix_sbe_common
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^[A-Za-z_][0-9A-Za-z_]*\.[A-Za-z_][0-9A-Za-z_]*$
  SbeToken:
    name: SbeToken
    definition_uri: https://w3id.org/lmodel/fix-sbe/SbeToken
    annotations:
      xsd_type:
        tag: xsd_type
        value: xs:token
    description: Text with no line break, tab or doubled space, and no space at either
      end.
    from_schema: https://w3id.org/lmodel/fix-sbe/schema/fix_sbe_common
    typeof: string
    base: str
    uri: xsd:token
    pattern: ^\S+( \S+)*$
enums:
  SbePresence:
    name: SbePresence
    definition_uri: https://w3id.org/lmodel/fix-sbe/SbePresence
    annotations:
      sbe_section:
        tag: sbe_section
        value: '4: Field attributes'
    description: Whether a value is on the wire, and whether it may be null.
    from_schema: https://w3id.org/lmodel/fix-sbe/schema/fix_sbe_common
    permissible_values:
      required:
        text: required
        description: A value is always sent, and it is never tested for null.
      optional:
        text: optional
        description: A value is sent, and a null marker says that none is set.
      constant:
        text: constant
        description: The schema states the value, so nothing is sent.
  SbeByteOrder:
    name: SbeByteOrder
    definition_uri: https://w3id.org/lmodel/fix-sbe/SbeByteOrder
    annotations:
      sbe_section:
        tag: sbe_section
        value: '4: messageSchema attributes'
    description: The order of the octets in every multi-octet number of a message.
    from_schema: https://w3id.org/lmodel/fix-sbe/schema/fix_sbe_common
    permissible_values:
      bigEndian:
        text: bigEndian
        description: The most significant octet comes first.
      littleEndian:
        text: littleEndian
        description: The least significant octet comes first.
  SbePrimitiveType:
    name: SbePrimitiveType
    definition_uri: https://w3id.org/lmodel/fix-sbe/SbePrimitiveType
    annotations:
      sbe_section:
        tag: sbe_section
        value: '2: Primitive type encodings'
    description: The wire types every encoding is finally built from.
    from_schema: https://w3id.org/lmodel/fix-sbe/schema/fix_sbe_common
    permissible_values:
      char:
        text: char
        description: One character of one octet.
      int8:
        text: int8
        description: A signed integer of one octet.
      int16:
        text: int16
        description: A signed integer of two octets.
      int32:
        text: int32
        description: A signed integer of four octets.
      int64:
        text: int64
        description: A signed integer of eight octets.
      uint8:
        text: uint8
        description: An unsigned integer of one octet.
      uint16:
        text: uint16
        description: An unsigned integer of two octets.
      uint32:
        text: uint32
        description: An unsigned integer of four octets.
      uint64:
        text: uint64
        description: An unsigned integer of eight octets.
      float:
        text: float
        description: A four-octet number in binary floating point.
      double:
        text: double
        description: An eight-octet number in binary floating point.
  SbeFixDatatype:
    name: SbeFixDatatype
    definition_uri: https://w3id.org/lmodel/fix-sbe/SbeFixDatatype
    annotations:
      sbe_section:
        tag: sbe_section
        value: '2: FIX datatype summary'
    description: The FIX datatypes the specification's summary table lists as a field's
      or an encoding's semantic type.
    comments:
    - semantic_type stays free text in the schema, because a message's holds a MsgType
      value and the specification suggests matching names ignoring case. tests/sbe_rules.py
      checks an encoding's and a field's against this list.
    from_schema: https://w3id.org/lmodel/fix-sbe/schema/fix_sbe_common
    permissible_values:
      int:
        text: int
      Length:
        text: Length
      TagNum:
        text: TagNum
      SeqNum:
        text: SeqNum
      NumInGroup:
        text: NumInGroup
      DayOfMonth:
        text: DayOfMonth
      Qty:
        text: Qty
      float:
        text: float
      Price:
        text: Price
      PriceOffset:
        text: PriceOffset
      Amt:
        text: Amt
      Percentage:
        text: Percentage
      char:
        text: char
      String:
        text: String
      EncodedText:
        text: EncodedText
      XMLData:
        text: XMLData
      data:
        text: data
      Country:
        text: Country
      Currency:
        text: Currency
      Exchange:
        text: Exchange
      Language:
        text: Language
      Boolean:
        text: Boolean
      MultipleCharValue:
        text: MultipleCharValue
      MultipleStringValue:
        text: MultipleStringValue
      MonthYear:
        text: MonthYear
      UTCTimestamp:
        text: UTCTimestamp
      UTCTimeOnly:
        text: UTCTimeOnly
      UTCDateOnly:
        text: UTCDateOnly
      LocalMktDate:
        text: LocalMktDate
      TZTimeOnly:
        text: TZTimeOnly
      TZTimestamp:
        text: TZTimestamp
slots:
  symbolic_name:
    name: symbolic_name
    definition_uri: https://w3id.org/lmodel/fix-sbe/symbolic_name
    description: What the schema calls this element.
    from_schema: https://w3id.org/lmodel/fix-sbe/schema/fix_sbe_common
    aliases:
    - name
    slot_uri: fix_sbe:symbolic_name
    owner: SbeFieldV2
    domain_of:
    - SbeValidValue
    - SbeChoice
    - SbeMemberV1
    - SbeBlockV1Mixin
    - SbeFieldV1
    - SbeElementV2
    - SbeBlockV2Mixin
    - SbeFieldV2
    range: SbeSymbolicName
    required: true
    pattern: ^[A-Za-z_][0-9A-Za-z_]{0,63}$
  sbe_id:
    name: sbe_id
    definition_uri: https://w3id.org/lmodel/fix-sbe/sbe_id
    annotations:
      xsd_type:
        tag: xsd_type
        value: xs:unsignedShort
    description: The number that identifies this element.
    from_schema: https://w3id.org/lmodel/fix-sbe/schema/fix_sbe_common
    aliases:
    - id
    slot_uri: fix_sbe:sbe_id
    owner: SbeFieldV2
    domain_of:
    - SbeMessageSchemaV1
    - SbeBlockV1Mixin
    - SbeFieldV1
    - SbeMessageSchemaV2
    - SbeBlockV2Mixin
    - SbeFieldV2
    range: integer
    minimum_value: 0
    maximum_value: 65535
  description:
    name: description
    definition_uri: https://w3id.org/lmodel/fix-sbe/description
    description: Free text about this element, for the people who read the schema.
    from_schema: https://w3id.org/lmodel/fix-sbe/schema/fix_sbe_common
    aliases:
    - description
    mappings:
    - schema:description
    slot_uri: schema:description
    owner: SbeFieldV2
    domain_of:
    - SbeValidValue
    - SbeChoice
    - SbeMessageSchemaV1
    - SbeEncodingV1
    - SbeBlockV1Mixin
    - SbeFieldV1
    - SbeMessageSchemaV2
    - SbeEncodingSetV2
    - SbeMessageSetV2
    - SbeElementV2
    - SbeBlockV2Mixin
    - SbeFieldV2
    range: string
  semantic_type:
    name: semantic_type
    definition_uri: https://w3id.org/lmodel/fix-sbe/semantic_type
    annotations:
      xsd_type:
        tag: xsd_type
        value: xs:token
    description: What this element means at the FIX application layer.
    from_schema: https://w3id.org/lmodel/fix-sbe/schema/fix_sbe_common
    aliases:
    - semanticType
    slot_uri: fix_sbe:semantic_type
    owner: SbeFieldV2
    domain_of:
    - SbeEncodingV1
    - SbeBlockV1Mixin
    - SbeFieldV1
    - SbeBlockV2Mixin
    - SbeFieldV2
    range: SbeToken
    pattern: ^\S+( \S+)*$
  since_version:
    name: since_version
    definition_uri: https://w3id.org/lmodel/fix-sbe/since_version
    annotations:
      xsd_type:
        tag: xsd_type
        value: xs:nonNegativeInteger
      sbe_section:
        tag: sbe_section
        value: '5: Since version'
    description: The schema version that added this element.
    from_schema: https://w3id.org/lmodel/fix-sbe/schema/fix_sbe_common
    aliases:
    - sinceVersion
    slot_uri: fix_sbe:since_version
    ifabsent: int(0)
    owner: SbeVersionedMixin
    domain_of:
    - SbeVersionedMixin
    range: integer
    minimum_value: 0
  deprecated_since:
    name: deprecated_since
    definition_uri: https://w3id.org/lmodel/fix-sbe/deprecated_since
    annotations:
      xsd_type:
        tag: xsd_type
        value: xs:nonNegativeInteger
      sbe_section:
        tag: sbe_section
        value: '5: Deprecated elements'
    description: The schema version that retired this element, which stays only for
      older applications.
    from_schema: https://w3id.org/lmodel/fix-sbe/schema/fix_sbe_common
    aliases:
    - deprecated
    slot_uri: fix_sbe:deprecated_since
    owner: SbeVersionedMixin
    domain_of:
    - SbeVersionedMixin
    range: integer
    minimum_value: 0
  offset:
    name: offset
    definition_uri: https://w3id.org/lmodel/fix-sbe/offset
    annotations:
      xsd_type:
        tag: xsd_type
        value: xs:unsignedInt
      sbe_section:
        tag: sbe_section
        value: '3: Field offset specified by message schema'
    description: The octet this element starts at, counted from zero at the start
      of its block or composite.
    from_schema: https://w3id.org/lmodel/fix-sbe/schema/fix_sbe_common
    aliases:
    - offset
    slot_uri: fix_sbe:offset
    owner: SbeFieldV2
    domain_of:
    - SbeMemberV1
    - SbeFieldV1
    - SbeMemberV2
    - SbeFieldV2
    range: integer
    minimum_value: 0
    maximum_value: 4294967295
  presence:
    name: presence
    definition_uri: https://w3id.org/lmodel/fix-sbe/presence
    description: Whether this element's value is required, optional or constant.
    from_schema: https://w3id.org/lmodel/fix-sbe/schema/fix_sbe_common
    aliases:
    - presence
    slot_uri: fix_sbe:presence
    ifabsent: string(required)
    owner: SbeFieldV2
    domain_of:
    - SbeSimpleTypeV1
    - SbeFieldV1
    - SbeMemberTypeV2
    - SbeFieldV2
    range: SbePresence
  value_ref:
    name: value_ref
    definition_uri: https://w3id.org/lmodel/fix-sbe/value_ref
    description: The valid value that gives a constant element its value.
    from_schema: https://w3id.org/lmodel/fix-sbe/schema/fix_sbe_common
    aliases:
    - valueRef
    slot_uri: fix_sbe:value_ref
    owner: SbeFieldV2
    domain_of:
    - SbeSimpleTypeV1
    - SbeFieldV1
    - SbeMemberTypeV2
    - SbeFieldV2
    range: SbeQualifiedName
    pattern: ^[A-Za-z_][0-9A-Za-z_]*\.[A-Za-z_][0-9A-Za-z_]*$
  element_value:
    name: element_value
    definition_uri: https://w3id.org/lmodel/fix-sbe/element_value
    annotations:
      xsd_type:
        tag: xsd_type
        value: xs:token
      sbe_section:
        tag: sbe_section
        value: '4: Constant value'
    description: The text of the XML element, which is the constant when presence
