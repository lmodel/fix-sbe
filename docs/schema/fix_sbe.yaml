    - symbolic_name
    - block_length
    - SbeBlockV2Mixin_alignment
    - description
    - SbeBlockV2Mixin_block_fields
    - SbeBlockV2Mixin_repeating_groups
    - SbeBlockV2Mixin_var_data_fields
