name: fix_sbe
title: FIX Simple Binary Encoding (SBE)
description: >-
  A LinkML model of FIX Simple Binary Encoding, a standard from the FIX Trading Community for
  encoding messages in binary. It describes SBE message schemas: encodings, message templates,
  fields, groups and variable-length data. The two editions differ on the wire and in their
  XML, so each has a module of its own.
